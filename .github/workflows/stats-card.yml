name: Update stats card

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build card
        run: python3 scripts/make_card.py assets/stats-card.svg
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-card.svg
          git diff --staged --quiet || (git commit -m "Update stats card" && git push)
